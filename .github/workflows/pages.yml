name: Build and deploy Klyvro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Restore and patch Klyvro source
        run: |
          set -euo pipefail
          rm -rf .site
          mkdir .site
          {
            cat source/part-00.b64
            cat source/part-01.b64
            cat source/part-02.b64
            cat patches/supabase/source-part02-suffix.b64part
            cat source/part-03.b64
            cat source/part-04.b64
            cat source/part-05.b64
          } | base64 --decode | tar -xz -C .site
          (cd .site && patch -p1 < ../patches/reliable/nexora.patch)
          (cd .site && python ../patches/reliable/retry-init.py)
          cp patches/reliable/voice-room.tsx .site/app/voice-room.tsx
          (cd .site && python ../patches/reliable/voice-v043.py)
          cp patches/reliable/pwa-register.tsx .site/app/pwa-register.tsx
          cp patches/reliable/sw.js .site/public/sw.js
          (cd .site && python ../patches/reliable/v044.py)
          (cd .site && python ../patches/reliable/v044-fix.py)
          (cd .site && python ../patches/reliable/v045.py)
          (cd .site && python ../patches/reliable/v046.py)
          (cd .site && python ../patches/reliable/v046-polish.py)
          base64 --decode patches/reliable/voice-v047.tsx.gz.b64 | gzip -dc > .site/app/voice-room.tsx
          (cd .site && python ../patches/reliable/v047.py)
          (cd .site && python ../patches/reliable/voice-v048.py)
          (cd .site && python ../patches/reliable/v048.py)
          (cd .site && python ../patches/reliable/v048-connect-hotfix.py)
          (cd .site && python ../patches/reliable/v049-screen-receive.py)
          (cd .site && python ../patches/reliable/v0410-reconnect.py)
          (cd .site && python ../patches/reliable/v0411-restart-request.py)
          (cd .site && python ../patches/reliable/v0412-truthful-call-status.py)
          (cd .site && python ../patches/reliable/v0413-ptt-focus-release.py)
          (cd .site && python ../patches/reliable/v0414-deafen-late-peer.py)

      - name: Validate Klyvro source invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('.site/app')
          joined = '\n'.join(p.read_text(encoding='utf-8') for p in root.glob('*') if p.is_file())
          required = [
              'const KLYVRO_BUILD = "0.4.14";',
              'VOZ • CORE v0.4.14',
              'formatMessageTime',
              'scheduleIdentityRetry',
              'setConnectAttempt',
              'currentProfileColor',
              'seenServerMessageIdsRef',
              'unread={readChannels[item.id] === false}',
              'PERFIL E PREFERÊNCIAS',
              'owned?: boolean',
              'DEFAULT_PROFILE: UserProfile = { name: "Jogador"',
              'liveProfiles',
              'screenSenders',
              'remoteScreens',
              'remoteVideoTracks',
              'remoteScreenActive',
              'bindNegotiatedVideoSender',
              'p_kind: "screen"',
              'p_kind: "restart"',
              'sendRestartRequestTo',
              'signal.kind === "restart"',
              'peerStates.some((peerState) => peerState === "failed" || peerState === "disconnected")',
              'peerStates.every((peerState) => peerState === "connected")',
              'addTransceiver("video", { direction: "sendrecv" })',
              'replaceScreenTrackForPeers',
              'getDisplayMedia',
              'Sua tela agora está sendo transmitida para a call',
              'mídia P2P',
              'playCatMeow',
              'voice-call-dock',
              'requestFullscreen',
              'screen-fullscreen-button',
              'visible={activeServer === voiceSession.serverId',
              'klyvro_update_profile_v2',
              'avatar_data',
              'display_name: "Souzza"',
              'display_name: "randola"',
              '{onlineSlots.length}/5 ONLINE',
              'continuing voice without remote photos',
              'continuing core connection without profile photos',
              'reconnectAttempts',
              'reconnectInFlight',
              'restartPeer',
              'connectionState === "disconnected"',
              'Não consegui restabelecer a mídia',
              'window.addEventListener("blur", release)',
              'document.addEventListener("visibilitychange", visibility)',
              'const deafenedRef = useRef(deafened);',
              'element.muted = deafenedRef.current;',
          ]
          forbidden = [
              'Online • 32 ms',
              'host: "Maya"',
              '24 de agosto de 2026',
              '/klyvro/og.png',
              'codex-preview',
              'PREFERÊNCIAS LOCAIS',
              'key={member.name}',
              'VOZ • CORE v0.4.5',
              'VOZ • CORE v0.4.6',
              'VOZ • CORE v0.4.7',
              'VOZ • CORE v0.4.8',
              'VOZ • CORE v0.4.9',
              'VOZ • CORE v0.4.10',
              'VOZ • CORE v0.4.11',
              'VOZ • CORE v0.4.12',
              'VOZ • CORE v0.4.13',
              'const KLYVRO_BUILD = "0.4.6";',
              'const KLYVRO_BUILD = "0.4.7";',
              'const KLYVRO_BUILD = "0.4.8";',
              'const KLYVRO_BUILD = "0.4.9";',
              'const KLYVRO_BUILD = "0.4.10";',
              'const KLYVRO_BUILD = "0.4.11";',
              'const KLYVRO_BUILD = "0.4.12";',
              'const KLYVRO_BUILD = "0.4.13";',
              'display_name: "Luccas"',
              'Prévia local da tela iniciada',
              'Sua tela • prévia local',
              '{onlineSlots.length}/3 ONLINE',
              'Os 3 perfis estão ativos',
              'Os 3 perfis estão em uso',
              'A foto continua salva apenas neste dispositivo',
          ]
          missing = [item for item in required if item not in joined]
          found = [item for item in forbidden if item in joined]
          package = json.loads(Path('.site/package.json').read_text(encoding='utf-8'))
          if package.get('version') != '0.4.14':
              missing.append('package version 0.4.14')
          if missing or found:
              raise SystemExit(f'Klyvro source validation failed; missing={missing}; forbidden={found}')
          print('Klyvro v0.4.14 late-peer deafen/PTT/reconnect/screen-sharing invariants OK')
          PY

      - name: Install dependencies
        working-directory: .site
        run: npm install --no-audit --no-fund

      - name: Build static site
        working-directory: .site
        run: npm run build

      - name: Prepare Pages artifact
        run: touch .site/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Check Pages HTTPS state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          code=$(curl -L -sS -o /tmp/pages-current.json -w "%{http_code}" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10" "$api")
          echo "Pages settings lookup: HTTP ${code}"
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/pages-current.json').read_text() or '{}')
          print('Pages:', {'cname': data.get('cname'), 'html_url': data.get('html_url'), 'https_enforced': data.get('https_enforced')})
          if data.get('https_enforced') is not True:
              print('::warning::Pages API reports https_enforced=false; Klyvro forces github.io HTTP sessions onto HTTPS in the client.')
          PY
          exit 0

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site/out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
