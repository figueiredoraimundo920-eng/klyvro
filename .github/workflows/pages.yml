name: Build and deploy Klyvro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Restore and patch Klyvro
        run: |
          set -euo pipefail
          rm -rf .site
          mkdir .site
          for part in 00 01 02 03 04 05; do
            curl -fsSL "https://raw.githubusercontent.com/figueiredoraimundo920-eng/klyvro/0ca56330125e6994596fceed8bb9b70bcc2386f0/source/part-${part}.b64"
          done | base64 --decode | tar -xz -C .site
          sed -i '1iexport const dynamic = "force-static";' .site/app/manifest.ts
          python3 patches/apply-realtime.py .site
          cp patches/voice-room.tsx .site/app/voice-room.tsx

      - name: Install dependencies
        working-directory: .site
        run: npm install --no-audit --no-fund

      - name: Build static site
        working-directory: .site
        run: npm run build

      - name: Prepare Pages artifact
        run: touch .site/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site/out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
