name: Build and deploy Klyvro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Restore and patch Klyvro source
        run: |
          set -euo pipefail
          rm -rf .site
          mkdir .site
          {
            cat source/part-00.b64
            cat source/part-01.b64
            cat source/part-02.b64
            cat patches/supabase/source-part02-suffix.b64part
            cat source/part-03.b64
            cat source/part-04.b64
            cat source/part-05.b64
          } | base64 --decode | tar -xz -C .site
          (cd .site && patch -p1 < ../patches/reliable/nexora.patch)
          cp patches/reliable/voice-room.tsx .site/app/voice-room.tsx
          cp patches/reliable/pwa-register.tsx .site/app/pwa-register.tsx
          cp patches/reliable/sw.js .site/public/sw.js

      - name: Install dependencies
        working-directory: .site
        run: npm install --no-audit --no-fund

      - name: Build static site
        working-directory: .site
        run: npm run build

      - name: Prepare Pages artifact
        run: touch .site/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site/out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
